<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentFlow — Secure Access</title>
<style>
:root{--nav:#10243a;--blue:#247be5;--ink:#162033;--muted:#657286;--bg:#f5f8fc;--white:#fff;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef5fc,#f8fbff);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}.gate{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(23,43,77,.14);padding:34px}.logo{font-size:30px;font-weight:850;letter-spacing:-.8px}.logo span{color:#38a0ff}.sub{color:var(--muted);margin:6px 0 28px}.lock{width:54px;height:54px;border-radius:15px;background:#eaf3ff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700;color:#526176}.field input{border:1px solid #d8e1ec;border-radius:10px;padding:12px 13px;font-size:15px;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #247be51c}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:750;font-size:15px;margin-top:14px;cursor:pointer}.error{min-height:20px;color:#c33448;font-size:13px;margin-top:9px}.hint{font-size:12px;color:#8995a6;text-align:center;margin-top:18px}@media(max-width:500px){.gate{padding:25px}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="lock">🔒</div>
  <div class="logo">Rent<span>Flow</span></div>
  <div class="sub">MATANGI CORPORATION · Secure Access</div>
  <form id="loginForm">
    <div class="field"><label for="password">Website password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" autofocus></div>
    <button class="btn" type="submit">Unlock Website</button>
    <div class="error" id="error"></div>
  </form>
  <div class="hint">Authorized access only</div>
</div>
<script>
const LEGACY_URL='https://raw.githubusercontent.com/Mann2324/flashzape/110a2ad6712c3b6ec4c169a867143781f3a09ee8/index.html';
const PASSWORD_HASH='acff881f3a971df4efef8d13ad4a956016713ff366b047f0235f02089531a8a9';
const SESSION_KEY='rentflow_authenticated';
async function sha256(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function loadApp(){try{const response=await fetch(LEGACY_URL,{cache:'no-store'});if(!response.ok)throw new Error('Unable to load application');const html=await response.text();document.open();document.write(html);document.close()}catch(e){document.getElementById('error').textContent='Unable to load the rental manager. Please refresh and try again.';sessionStorage.removeItem(SESSION_KEY)}}
if(sessionStorage.getItem(SESSION_KEY)==='1')loadApp();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;const error=document.getElementById('error');error.textContent='';if(await sha256(password)===PASSWORD_HASH){sessionStorage.setItem(SESSION_KEY,'1');loadApp()}else{error.textContent='Incorrect password. Please try again.';document.getElementById('password').select()}});
</script>
</body>
</html>
