<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentFlow — Secure Access</title><style>:root{--blue:#247be5;--ink:#162033;--muted:#657286;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#eef5fc,#f8fbff);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}.gate{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(23,43,77,.14);padding:34px}.logo{font-size:30px;font-weight:850}.logo span{color:#38a0ff}.sub{color:var(--muted);margin:6px 0 28px}.lock{width:54px;height:54px;border-radius:15px;background:#eaf3ff;display:grid;place-items:center;font-size:25px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700;color:#526176}.field input{border:1px solid #d8e1ec;border-radius:10px;padding:12px 13px;font-size:15px;outline:none}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:750;font-size:15px;margin-top:14px;cursor:pointer}.error{min-height:20px;color:#c33448;font-size:13px;margin-top:9px}.hint{font-size:12px;color:#8995a6;text-align:center;margin-top:18px}</style></head><body><div class="gate"><div class="lock">🔒</div><div class="logo">Rent<span>Flow</span></div><div class="sub">MATANGI CORPORATION · Secure Access</div><form id="loginForm"><div class="field"><label for="password">Website password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" autofocus></div><button class="btn" type="submit">Unlock Website</button><div class="error" id="error"></div></form><div class="hint">Authorized access only</div></div><script>const PASSWORD_HASH='6aaeff93c268b256572b6117f11eb8f88d1ef0403e60ac911ff5b5877b660f28',SESSION_KEY='rentflow_authenticated';async function sha256(v){let d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}function loadApp(){window.location.href='enhanced.html'}if(sessionStorage.getItem(SESSION_KEY)==='1')loadApp();loginForm.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';if(await sha256(password.value)===PASSWORD_HASH){sessionStorage.setItem(SESSION_KEY,'1');loadApp()}else{error.textContent='Incorrect password. Please try again.';password.select()}});</script></body></html>
